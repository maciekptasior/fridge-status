<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domowa Spiżarnia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

  <div class="container">
    <h1>Domowa Spiżarnia 🛒</h1>

    <!-- Formularz dodawania produktu -->
    <div class="card">

      <!-- Przycisk skanera -->
  <button id="scan-toggle-btn" type="button" onclick="toggleScanner()" class="btn-scan" style="width: 100%; margin-bottom: 12px;">
    📷 Skanuj kod kreskowy
  </button>
  <!-- Okno kamery -->
  <div id="reader" style="display: none; width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 12px;"></div>
      
      <form id="add-form" onsubmit="addItem(event)">
        <div class="form-group">
          <input type="text" id="item-name" placeholder="Nazwa produktu..." list="suggested-items" required autocomplete="off">
          <datalist id="suggested-items">
            <option value="Mleko">
            <option value="Chleb">
            <option value="Masło">
            <option value="Jajka">
            <option value="Ser żółty">
            <option value="Szynka">
            <option value="Pomidory">
            <option value="Woda">
          </datalist>

          <select id="item-category" required>
            <option value="Nabiał">Nabiał</option>
            <option value="Pieczywo">Pieczywo</option>
            <option value="Mięso">Mięso</option>
            <option value="Warzywa i Owoce">Warzywa i Owoce</option>
            <option value="Spiżarnia / Suche">Spiżarnia / Suche</option>
            <option value="Inne" selected>Inne</option>
          </select>

          <button type="submit">Dodaj</button>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="item-musthave">
          <span>Produkt obowiązkowy</span>
        </label>
      </form>
    </div>

    <!-- Zakładki -->
    <div class="tabs">
      <div class="tab active" id="tab-pantry" onclick="switchTab('pantry')">Spiżarnia</div>
      <div class="tab" id="tab-shopping" onclick="switchTab('shopping')">Do kupienia (0)</div>
    </div>

    <!-- Pasek wyszukiwania -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="🔍 Szukaj produktu..." oninput="onSearchInput()">
    </div>

    <!-- Kontener na listy -->
    <div class="card">
      <div id="pantry-list"></div>
      <div id="shopping-list" style="display: none;"></div>

      <!-- Akcje zbiorcze dla listy zakupów -->
      <div id="shopping-actions" class="shopping-actions" style="display: none;">
        <button class="btn-secondary" onclick="shareShoppingList()">📤 Udostępnij listę</button>
        <button class="btn-success" onclick="buyAllShoppingItems()">✅ Kupiono wszystkie</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    // Konfiguracja Firebase — Uzupełnij swoimi danymi
    const firebaseConfig = {
  apiKey: "AIzaSyCSUj5YjW9A261sHSU8PTQL0jaqWjlg16Q",
  authDomain: "fridge-status-aa96a.firebaseapp.com",
  databaseURL: "https://fridge-status-aa96a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fridge-status-aa96a",
  storageBucket: "fridge-status-aa96a.firebasestorage.app",
  messagingSenderId: "417870352083",
  appId: "1:417870352083:web:2bfed85ca7f944de030e26"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Rejestracja Service Workera
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker zarejestrowany:', reg.scope))
        .catch(err => console.error('Błąd rejestracji SW:', err));
    }

    // Inicjalizacja Powiadomień Firebase Messaging
    try {
      const messaging = getMessaging(app);
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          getToken(messaging, { vapidKey: 'TWÓJ_PUBLICZNY_KLUCZ_VAPID' })
            .then(currentToken => {
              if (currentToken) {
                console.log('FCM Token:', currentToken);
              }
            }).catch(err => console.log('Błąd podczas pobierania tokena:', err));
        }
      });

      onMessage(messaging, (payload) => {
        console.log('Otrzymano wiadomość na pierwszym planie: ', payload);
        alert(`${payload.notification.title}: ${payload.notification.body}`);
      });
    } catch (e) {
      console.log('Firebase Messaging nieobsługiwany lub nieskonfigurowany.');
    }

    // Stan aplikacji
    let items = [];
    let activeTab = 'pantry';
    let searchQuery = '';

    const CATEGORY_ICONS = {
      'Nabiał': '🧀',
      'Pieczywo': '🥖',
      'Mięso': '🥩',
      'Warzywa i Owoce': '🥦',
      'Spiżarnia / Suche': '🍝',
      'Inne': '📦'
    };

    // Subskrypcja bazy danych na żywo
    const itemsRef = ref(db, 'items');
    onValue(itemsRef, (snapshot) => {
      const data = snapshot.val();
      items = [];
      if (data) {
        for (const key in data) {
          items.push({ firebaseId: key, ...data[key] });
        }
      }
      render();
    });

    // Przełączanie zakładek
    window.switchTab = function(tab) {
      activeTab = tab;
      document.getElementById('tab-pantry').classList.toggle('active', tab === 'pantry');
      document.getElementById('tab-shopping').classList.toggle('active', tab === 'shopping');
      
      document.getElementById('pantry-list').style.display = tab === 'pantry' ? 'block' : 'none';
      document.getElementById('shopping-list').style.display = tab === 'shopping' ? 'block' : 'none';
      document.getElementById('shopping-actions').style.display = tab === 'shopping' ? 'flex' : 'none';
      
      render();
    };

    // Wyszukiwarka
    window.onSearchInput = function() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      render();
    };

    // Smart Dodawanie (zwiększa ilość jeśli produkt istnieje)
    window.addItem = function(event) {
      event.preventDefault();
      
      const nameInput = document.getElementById('item-name');
      const categorySelect = document.getElementById('item-category');
      const mustHaveCheckbox = document.getElementById('item-musthave');

      const name = nameInput.value.trim();
      const category = categorySelect.value;
      const mustHave = mustHaveCheckbox.checked;

      if (!name) return;

      const existingItem = items.find(i => i.name.toLowerCase() === name.toLowerCase());

      if (existingItem) {
        const itemRef = ref(db, `items/${existingItem.firebaseId}`);
        update(itemRef, {
          qty: (existingItem.qty || 0) + 1,
          category: category,
          mustHave: mustHave
        });
      } else {
        push(ref(db, 'items'), {
          name: name,
          category: category,
          mustHave: mustHave,
          qty: 1,
          createdAt: Date.now()
        });
      }

      nameInput.value = '';
      mustHaveCheckbox.checked = false;
    };

    // Zmiana ilości
    window.updateQty = function(id, change) {
      const item = items.find(i => i.firebaseId === id);
      if (!item) return;

      const newQty = Math.max(0, (item.qty || 0) + change);
      update(ref(db, `items/${id}`), { qty: newQty });
    };

    // Oznaczenie jako kupione z poziomu listy zakupów
    window.markAsBought = function(id) {
      update(ref(db, `items/${id}`), { qty: 1 });
    };

    // Usuwanie trwale z bazy
    window.removeItem = function(id) {
      remove(ref(db, `items/${id}`));
    };

    // Kupienie wszystkich produktów z listy zakupów
    window.buyAllShoppingItems = function() {
      const shoppingItems = items.filter(i => (i.qty || 0) === 0);
      if (shoppingItems.length === 0) return;

      if (confirm(`Czy na pewno chcesz oznaczyć wszystkie ${shoppingItems.length} produkty jako kupione?`)) {
        shoppingItems.forEach(item => {
          update(ref(db, `items/${item.firebaseId}`), { qty: 1 });
        });
      }
    };

    // Udostępnianie listy zakupów (WhatsApp/SMS/Schowek)
    window.shareShoppingList = function() {
      const shoppingItems = items.filter(i => (i.qty || 0) === 0);
      if (shoppingItems.length === 0) {
        alert("Lista zakupów jest pusta!");
        return;
      }

      let text = "🛒 *Lista Zakupów:*\n";
      shoppingItems.forEach((item, index) => {
        text += `${index + 1}. ${item.name}${item.mustHave ? ' ⚠️ [OBOWIĄZKOWY]' : ''}\n`;
      });

      if (navigator.share) {
        navigator.share({ title: 'Lista Zakupów', text: text })
          .catch(err => console.log('Anulowano udostępnianie:', err));
      } else {
        navigator.clipboard.writeText(text).then(() => {
          alert("Skopiowano listę zakupów do schowka!");
        });
      }
    };

    // Główna funkcja renderująca
    function render() {
      // Filtrowanie produktów na podstawie wyszukiwarki
      const filteredItems = items.filter(i => i.name.toLowerCase().includes(searchQuery));

      const pantryItems = filteredItems.filter(i => (i.qty || 0) > 0);
      const shoppingItems = filteredItems.filter(i => (i.qty || 0) === 0);

      // Aktualizacja licznika w zakładce
      const totalShoppingCount = items.filter(i => (i.qty || 0) === 0).length;
      document.getElementById('tab-shopping').textContent = `Do kupienia (${totalShoppingCount})`;

      // Renderowanie Spiżarni
      renderList(pantryItems, document.getElementById('pantry-list'), 'pantry');

      // Renderowanie Listy Zakupów
      renderList(shoppingItems, document.getElementById('shopping-list'), 'shopping');
    }

    function renderList(listItems, containerElement, mode) {
      if (listItems.length === 0) {
        containerElement.innerHTML = `<div class="empty-state">${searchQuery ? 'Brak wyników wyszukiwania.' : 'Brak produktów w tej sekcji.'}</div>`;
        return;
      }

      // Grupowanie wg kategorii
      const grouped = listItems.reduce((acc, item) => {
        const cat = item.category || 'Inne';
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(item);
        return acc;
      }, {});

      let html = '';
      for (const [categoryName, categoryItems] of Object.entries(grouped)) {
        const icon = CATEGORY_ICONS[categoryName] || '📦';
        html += `<h3>${icon} ${categoryName}</h3>`;

        html += categoryItems.map(item => `
          <div class="item">
            <div class="item-info">
              <strong>${item.name}</strong>
              ${item.mustHave ? '<span class="badge">OBOWIĄZKOWY</span>' : ''}
            </div>
            <div class="controls">
              ${mode === 'pantry' ? `
                <button class="btn-qty" onclick="updateQty('${item.firebaseId}', -1)">-</button>
                <span class="qty-count">${item.qty}</span>
                <button class="btn-qty" onclick="updateQty('${item.firebaseId}', 1)">+</button>
              ` : `
                <button class="btn-buy" onclick="markAsBought('${item.firebaseId}')">✅ Kupiono</button>
              `}
              <button class="btn-delete" onclick="removeItem('${item.firebaseId}')" title="Usuń z bazy">✕</button>
            </div>
          </div>
        `).join('');
      }

      containerElement.innerHTML = html;
    }

    let html5QrcodeScanner = null;

// Mapa kategorii Open Food Facts -> Kategorie w Twojej aplikacji
function mapCategory(offCategories) {
  if (!offCategories) return 'Inne';
  const cats = offCategories.toLowerCase();

  if (cats.includes('dairies') || cats.includes('milk') || cats.includes('cheese') || cats.includes('yogurt') || cats.includes('nabiał')) return 'Nabiał';
  if (cats.includes('bread') || cats.includes('bakery') || cats.includes('pieczywo')) return 'Pieczywo';
  if (cats.includes('meats') || cats.includes('poultry') || cats.includes('sausages') || cats.includes('mięso')) return 'Mięso';
  if (cats.includes('fruits') || cats.includes('vegetables') || cats.includes('owoce') || cats.includes('warzywa')) return 'Warzywa i Owoce';
  if (cats.includes('groceries') || cats.includes('cereal') || cats.includes('pasta') || cats.includes('canned') || cats.includes('suche')) return 'Spiżarnia / Suche';
  
  return 'Inne';
}

// Pobieranie informacji o produkcie ze sklepu po kodzie EAN
async function fetchProductFromOpenFoodFacts(barcode) {
  try {
    const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json?fields=product_name,product_name_pl,categories_tags`);
    const data = await response.json();

    if (data.status === 1 && data.product) {
      const p = data.product;
      // Wyszukaj nazwę po polsku lub ogólną nazwę
      const name = p.product_name_pl || p.product_name || barcode;
      const category = mapCategory(p.categories_tags ? p.categories_tags.join(' ') : '');

      return { name, category };
    }
  } catch (err) {
    console.error("Błąd pobierania danych z Open Food Facts:", err);
  }
  return { name: barcode, category: 'Inne' };
}

// Włączanie / wyłączanie kamery
window.toggleScanner = function() {
  const readerDiv = document.getElementById('reader');
  const scanBtn = document.getElementById('scan-toggle-btn');

  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().then(() => {
      html5QrcodeScanner = null;
      readerDiv.style.display = 'none';
      scanBtn.textContent = '📷 Skanuj kod kreskowy';
    }).catch(err => console.error("Błąd zatrzymania skanera:", err));
  } else {
    readerDiv.style.display = 'block';
    scanBtn.textContent = '⏳ Ładowanie kamery...';

    html5QrcodeScanner = new Html5Qrcode("reader");
    
    const config = { 
      fps: 10, 
      qrbox: { width: 260, height: 140 },
      formatsToSupport: [ 
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128
      ]
    };

    html5QrcodeScanner.start(
      { facingMode: "environment" },
      config,
      onScanSuccess
    ).then(() => {
      scanBtn.textContent = '❌ Zamknij aparat';
    }).catch(err => {
      alert("Nie udało się uzyskać dostępu do kamery.");
      console.error(err);
      window.toggleScanner();
    });
  }
};

// Obsługa po udanym przeskanowaniu kreski
async function onScanSuccess(barcode) {
  if (navigator.vibrate) navigator.vibrate(100);

  // Wyłączenie aparatu natychmiast po odczytaniu kodu
  window.toggleScanner();

  const nameInput = document.getElementById('item-name');
  nameInput.value = "Szukam w bazie...";

  // Pobranie danych ze sklepu
  const productData = await fetchProductFromOpenFoodFacts(barcode);

  nameInput.value = productData.name;
  document.getElementById('item-category').value = productData.category;
}
    
  </script>
</body>
</html>
